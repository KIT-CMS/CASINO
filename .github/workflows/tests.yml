name: tests

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # gssapi (via auth-get-sso-cookie) has no Linux wheels and builds against krb5-config.
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libkrb5-dev
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --no-interaction
      - name: Run tests
        run: |
          python --version
          source ./setup.sh
          python -m unittest discover -s tests -v
