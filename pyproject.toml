[project]
name = "casino"
version = "0.1.0"
description = "CMS-Aligned Simulation Infrastructure for NanoAOD Outputs"
authors = [
    {name = "Simon Daigler",email = "simon.daigler@kit.edu"}
]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "law (>=0.1.20,<0.2.0)",
    "luigi (>=3.8.0,<4.0.0)",
    "questionary (>=2.1.1,<3.0.0)",
    "auth-get-sso-cookie (>=2.2.0,<3.0.0)"
]

[project.scripts]
casino = "casino:main"

[tool.poetry]
packages = [
    { include = "casino.py", from = "src" },
    { include = "application", from = "src" },
    { include = "cli", from = "src" },
    { include = "domain", from = "src" },
    { include = "delphes_nano", from = "src" },
    { include = "etp_law", from = "src" },
    { include = "infrastructure", from = "src" }
]

[tool.poetry.group.dev.dependencies]
uproot = ">=5.3,<6.0"
awkward = ">=2.6,<3.0"
numpy = ">=1.26,<2.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
