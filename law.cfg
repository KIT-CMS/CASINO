[core]
index_file = $PWD/artifacts/.law/index

[modules]
etp_law.tasks

[logging]
law: INFO

[wlcg_fs]
; base must point to remote storage reachable from the batch system
base: root://cmsdcache-kit-disk.gridka.de:1094//store/user/${USER}/mc_production
base_stat: davs://cmsdcache-kit-disk.gridka.de:2880/pnfs/gridka.de/cms/disk-only/store/user/${USER}/mc_production
base_exists: davs://cmsdcache-kit-disk.gridka.de:2880/pnfs/gridka.de/cms/disk-only/store/user/${USER}/mc_production
base_chmod: davs://cmsdcache-kit-disk.gridka.de:2880/pnfs/gridka.de/cms/disk-only/store/user/${USER}/mc_production
base_unlink: davs://cmsdcache-kit-disk.gridka.de:2880/pnfs/gridka.de/cms/disk-only/store/user/${USER}/mc_production
base_rmdir: davs://cmsdcache-kit-disk.gridka.de:2880/pnfs/gridka.de/cms/disk-only/store/user/${USER}/mc_production
base_mkdir: davs://cmsdcache-kit-disk.gridka.de:2880/pnfs/gridka.de/cms/disk-only/store/user/${USER}/mc_production
base_listdir: davs://cmsdcache-kit-disk.gridka.de:2880/pnfs/gridka.de/cms/disk-only/store/user/${USER}/mc_production
base_filecopy: davs://cmsdcache-kit-disk.gridka.de:2880/pnfs/gridka.de/cms/disk-only/store/user/${USER}/mc_production
gfal_transfer_checksum_check: True

[job]
job_file_dir = $PWD/artifacts/.law_jobs
job_file_dir_mkdtemp = False
job_file_dir_cleanup = True
; Keep law's default htcondor_job_grouping_submit=True: batched submission ships
; law_job.sh unrendered and every job exits 20 at the literal {{bootstrap_file}}.

[luigi_core]
local_scheduler: True
no_lock: True

[luigi_worker]
keep_alive: True
ping_interval: 20
wait_interval: 20
max_reschedules: 0

[luigi_scheduler]
retry_count: 0
